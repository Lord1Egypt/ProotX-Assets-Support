name: support-release

# Trusted release pipeline. Triggered only by push of a release tag (v*), so the build always
# runs from the exact tagged commit. Two independent jobs:
#   build   - read-only token, runs the privileged pinned builder, produces verified assets
#   publish - write token, NO Docker, publishes the already-verified assets
#
# The privileged builder never runs for pull_request or untrusted refs.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (exact tag commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify tagged source lock
        run: |
          python3 - <<'PY'
          import json
          lock = json.load(open("provenance/sources.lock.json"))
          assert lock["schemaVersion"] == 1
          assert lock["applicationMinSdk"] == 21
          assert lock["legacySupportHostRange"] == "21-28"
          assert lock["modernSupportHostRange"] == "29+"
          assert lock["modernSupportBuildApi"] == 24
          assert lock["toolchain"] == {"ndk": "29", "apiLevel": 24}
          assert lock["termuxPackages"]["commit"] == "0ffca06c59752c6d52c646980d956b961064e1fc"
          assert lock["builder"]["digest"] == "sha256:374fedda8d2ce7a8ab499735d39329301c4f2f18ea4411b3cf7c93d4668768ab"
          assert lock["dependencies"][0]["commit"] == "7266fb3e8516535682f5a9c8f3a7e70f6506eddb"
          assert lock["dependencies"][0]["archiveSha256"] == "29385d1ddb619a9c4449ab512bfd55032034b22f724ddf98fc95ff300ea32135"
          print("lock OK")
          PY

      - name: LEGACY INPUT VERIFICATION
        run: |
          set -euo pipefail
          mkdir -p .work/legacy
          python3 - <<'PY' > /tmp/legacy_zips.txt
          import json
          lock = json.load(open("provenance/sources.lock.json"))
          for abi, digest in lock["legacyRelease"]["zips"].items():
              print(abi, digest)
          PY
          while read -r abi digest; do
            curl -fsSL -o ".work/legacy/$abi-assets.zip" \
              "https://github.com/Lord1Egypt/ProotX-Assets-Support/releases/download/v1.0.0/$abi-assets.zip"
            echo "$digest  .work/legacy/$abi-assets.zip" | sha256sum -c -
            echo "LEGACY VERIFY  $abi  ZIP  $digest  PASS"
          done < /tmp/legacy_zips.txt

      - name: Pull pinned builder
        run: docker pull ghcr.io/termux/package-builder@sha256:374fedda8d2ce7a8ab499735d39329301c4f2f18ea4411b3cf7c93d4668768ab

      - name: Build #1 (all four ABIs)
        env:
          WORK_DIR: ${{ github.workspace }}/.work-a
          OUT_DIR: ${{ github.workspace }}/dist-a
        run: ./build-support.sh all

      - name: Build #2 (all four ABIs, independent cache/output)
        env:
          WORK_DIR: ${{ github.workspace }}/.work-b
          OUT_DIR: ${{ github.workspace }}/dist-b
        run: ./build-support.sh all

      - name: Reproducibility comparison
        run: |
          set -euo pipefail
          for z in arm64-v8a armeabi-v7a x86 x86_64; do
            a=$(sha256sum "dist-a/$z-assets.zip" | cut -d' ' -f1)
            b=$(sha256sum "dist-b/$z-assets.zip" | cut -d' ' -f1)
            echo "$z  A=$a  B=$b"
            [ "$a" = "$b" ] || { echo "REPRODUCIBILITY FAILURE for $z"; exit 1; }
          done
          echo "two clean builds are byte-identical"

      - name: Verify freshly built archives against the committed release manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, hashlib
          ver = os.environ["GITHUB_REF_NAME"]
          committed = json.load(open(f"provenance/releases/{ver}.json"))
          for z, meta in committed["archives"].items():
              p = os.path.join("dist-a", z)
              h = hashlib.sha256(open(p, "rb").read()).hexdigest()
              assert h == meta["sha256"], f"{z}: rebuilt {h} != committed {meta['sha256']}"
              assert os.path.getsize(p) == meta["size"], f"{z}: size mismatch"
              print(f"{z}: committed digest reproduced")
          PY

      - name: Release metadata (manifest + SHA256SUMS + SBOM) at tag commit
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          mkdir -p out
          python3 scripts/release_metadata.py \
            --dist dist-a --version "$VER" --out out \
            --source-commit "$GITHUB_SHA" --repo-root "$GITHUB_WORKSPACE"

      - name: Stage flat release assets
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          mkdir -p release
          cp dist-a/*.zip release/
          cp out/SHA256SUMS "out/${VER}.spdx.json" "out/${VER}-provenance.json" release/
          ls -l release

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prootx-support-release
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for release notes only; no rebuild)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prootx-support-release
          path: release

      - name: Verify SHA256SUMS and expected file set
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          for f in arm64-v8a-assets.zip armeabi-v7a-assets.zip x86-assets.zip x86_64-assets.zip \
                   "${GITHUB_REF_NAME}.spdx.json" "${GITHUB_REF_NAME}-provenance.json" SHA256SUMS; do
            [ -f "$f" ] || { echo "missing expected asset: $f"; exit 1; }
          done
          echo "release artifact verified"

      - name: Publish GitHub release (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          gh release create "$VER" \
            "release/arm64-v8a-assets.zip" "release/armeabi-v7a-assets.zip" \
            "release/x86-assets.zip" "release/x86_64-assets.zip" \
            "release/SHA256SUMS" "release/${VER}.spdx.json" "release/${VER}-provenance.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ProotX support bundle ${VER}" \
            --notes-file "docs/RELEASE_NOTES_${VER}.md"

